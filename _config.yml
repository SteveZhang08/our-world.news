name: Install Ruby with ruby-build

on: [push, pull_request]

jobs:
  install-ruby:
    runs-on: ubuntu-latest  # 使用 GitHub 托管的 Ubuntu 运行器
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install rbenv and ruby-build
        run: |
          # 安装 rbenv
          git clone https://github.com/rbenv/rbenv.git ~/.rbenv
          echo '$HOME/.rbenv/bin' >> $GITHUB_PATH
          echo 'eval "$(rbenv init -)"' >> $GITHUB_ENV
          mkdir -p "$(rbenv root)"/plugins
          # 安装 ruby-build 作为 rbenv 插件
          git clone https://github.com/rbenv/ruby-build.git "$(rbenv root)"/plugins/ruby-build

      - name: Install Ruby 3.1.4
        run: |
          rbenv install 3.1.4
          rbenv global 3.1.4
          ruby -v  # 验证 Ruby 版本

      - name: Your build steps here
        run: |
